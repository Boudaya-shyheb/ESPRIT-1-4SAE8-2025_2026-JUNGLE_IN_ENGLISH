
name: Angular Build and SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  angular-analysis:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Angular dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Angular frontend
        working-directory: Frontend
        run: npm run build

      - name: Analyze Angular with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        working-directory: Frontend
        run: |
          npx --yes @sonar/scan `
            -Dsonar.projectKey=jungle-in-english `
            -Dsonar.projectName="Jungle in English - Angular" `
            -Dsonar.sources=src `
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts"
