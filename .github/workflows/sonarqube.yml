name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check environment
        shell: powershell
        run: |
          java -version
          mvn -version
          node --version
          npm --version
          sonar-scanner --version

      - name: Build Java microservices
        shell: powershell
        run: |
          $poms = Get-ChildItem -Path . -Recurse -Filter pom.xml |
            Where-Object { $_.FullName -notmatch '[\\/](target|\.git)[\\/]' }

          if (-not $poms) {
            throw "No Maven pom.xml files found."
          }

          foreach ($pom in $poms) {
            Write-Host "Building $($pom.FullName)"
            mvn -B -f "$($pom.FullName)" clean verify

            if ($LASTEXITCODE -ne 0) {
              throw "Build failed: $($pom.FullName)"
            }
          }

      - name: Analyze repository with SonarQube
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner `
            "-Dsonar.projectKey=jungle-in-english" `
            "-Dsonar.projectName=Jungle in English" `
            "-Dsonar.sources=." `
            "-Dsonar.sourceEncoding=UTF-8" `
            "-Dsonar.exclusions=**/.git/**,**/node_modules/**,**/target/**,**/build/**,**/dist/**,**/coverage/**,**/.angular/**,**/*.min.js,**/*.map"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis failed."
          }
